<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>금샘의 행복한 수업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap">
<style>
/* Layout: one stacked column — sticker title, big seven-segment LCD panel, progress strip, control row, setting board */
:root{
  --ink:#141414;
  --paper:#FFFDF4;
  --ground:#FFF3C9;
  --yellow:#FFD23F;
  --pink:#FF6B9E;
  --mint:#38D9A9;
  --blue:#6C8CFF;
  --lcd:#1B1B1F;
  --seg-on:#FFD23F;
  --seg-off:rgba(255,210,63,.09);
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --bw:4px;
  --sh:6px 6px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:18px;
  background-image:radial-gradient(var(--ink) 1.2px,transparent 1.3px);background-size:26px 26px;
  background-color:var(--ground);
}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:24px 40px;display:flex;flex-direction:column;gap:22px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.title{
  font-family:var(--f-display);font-weight:400;margin:0;font-size:clamp(28px,6vw,52px);line-height:1.05;
  background:var(--pink);color:var(--ink);border:var(--bw) solid var(--ink);box-shadow:var(--sh);
  padding:10px 20px 8px;transform:rotate(-2deg);text-wrap:balance;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both;
}
.title span{background:var(--yellow);padding:0 6px;border:3px solid var(--ink);display:inline-block;transform:rotate(3deg);margin-left:4px}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:3px solid var(--ink);background:var(--paper);padding:6px 12px;box-shadow:4px 4px 0 var(--ink);font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* buttons */
.btn{
  font-family:var(--f-body);font-size:20px;color:var(--ink);background:var(--paper);
  border:var(--bw) solid var(--ink);box-shadow:var(--sh);padding:10px 18px;cursor:pointer;
  transition:transform .08s ease,box-shadow .08s ease,background .15s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.btn:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.num:focus-visible{outline:4px dashed var(--blue);outline-offset:4px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn.small{font-size:16px;padding:6px 12px;box-shadow:4px 4px 0 var(--ink)}
.btn.small:active{transform:translate(4px,4px)}

/* LCD panel */
.panel{
  background:var(--lcd);border:var(--bw) solid var(--ink);box-shadow:10px 10px 0 var(--ink);
  padding:clamp(16px,4vw,40px) clamp(12px,3vw,36px);position:relative;
}
.panel-label{position:absolute;top:-18px;left:18px;background:var(--mint);border:3px solid var(--ink);padding:2px 12px;font-size:16px;letter-spacing:.08em}
.status{position:absolute;top:-18px;right:18px;border:3px solid var(--ink);padding:2px 12px;font-size:16px;background:var(--paper)}
.status.running{background:var(--mint)} .status.paused{background:var(--yellow)} .status.done{background:var(--pink)}
.clock{
  --d:clamp(52px,15.5vw,150px);
  display:flex;justify-content:center;align-items:center;gap:calc(var(--d)*.16);
}
.digit{position:relative;width:var(--d);height:calc(var(--d)*1.75);--t:calc(var(--d)*.17);--gap:3px;flex:none}
.seg{position:absolute;background:var(--seg-off);border-radius:calc(var(--t)*.25);transition:background .12s,box-shadow .12s}
.seg.on{background:var(--seg-on);box-shadow:0 0 calc(var(--t)*.9) color-mix(in srgb,var(--seg-on) 55%,transparent)}
.s-a,.s-d,.s-g{left:calc(var(--t) + var(--gap));right:calc(var(--t) + var(--gap));height:var(--t)}
.s-a{top:0}.s-d{bottom:0}.s-g{top:calc(50% - var(--t)/2)}
.s-b,.s-c,.s-e,.s-f{width:var(--t);height:calc(50% - var(--t)*1.5 - var(--gap)*2)}
.s-f,.s-b{top:calc(var(--t) + var(--gap))}
.s-e,.s-c{bottom:calc(var(--t) + var(--gap))}
.s-f,.s-e{left:0}.s-b,.s-c{right:0}
.pair{display:flex;gap:calc(var(--d)*.16)}
.colon{display:flex;flex-direction:column;gap:calc(var(--d)*.5);flex:none}
.colon i{width:calc(var(--d)*.2);height:calc(var(--d)*.2);background:var(--seg-on);border-radius:3px;box-shadow:0 0 12px color-mix(in srgb,var(--seg-on) 55%,transparent)}
.blink .colon i{animation:blink 1s steps(1) infinite}
.unit-row{display:flex;justify-content:center;gap:calc(var(--d)*1.9);margin-top:14px;color:var(--seg-on);opacity:.7;font-size:clamp(14px,2.4vw,20px);letter-spacing:.3em;--d:clamp(52px,15.5vw,150px)}
.panel.hurry{--seg-on:#FF6B9E;--seg-off:rgba(255,107,158,.1)}
.panel.hurry .clock{animation:throb 1s ease-in-out infinite}
.panel.done{--seg-on:#38D9A9;--seg-off:rgba(56,217,169,.1);animation:shake .5s 2}

/* progress */
.bar{height:30px;border:var(--bw) solid var(--ink);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.fill{
  height:100%;background-color:var(--blue);border-right:var(--bw) solid var(--ink);transition:width .25s linear;
  background-image:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(20,20,20,.18) 14px 28px);background-size:40px 40px;
}
.fill.moving{animation:stripes .8s linear infinite}
.fill.hurry{background-color:var(--pink)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.btn.go{background:var(--mint);font-size:clamp(22px,4vw,30px);padding:12px 34px;min-width:9em}
.btn.pause{background:var(--yellow)}
.btn.reset{background:var(--paper)}
.btn.big{font-size:clamp(22px,4vw,30px);padding:12px 26px}

/* setting board */
.board{background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:var(--sh);padding:20px;display:flex;flex-direction:column;gap:18px;transition:opacity .2s}
.board.locked{opacity:.55}
.board h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hint{font-size:15px;opacity:.75}
.steppers{display:flex;flex-wrap:wrap;gap:18px}
.stepper{display:flex;align-items:center;gap:10px;flex:1 1 220px}
.stepper label{font-size:22px;min-width:1.6em}
.num{
  width:4.2ch;font-family:var(--f-display);font-size:34px;text-align:center;padding:4px 0;
  border:var(--bw) solid var(--ink);background:var(--yellow);color:var(--ink);font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;appearance:textfield;
}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sq{width:52px;height:52px;padding:0;font-size:28px;line-height:1;flex:none}
.presets{display:flex;flex-wrap:wrap;gap:12px}
.presets .btn.small:nth-child(5n+1){background:#FFE7F0}
.presets .btn.small:nth-child(5n+2){background:#E5FBF3}
.presets .btn.small:nth-child(5n+3){background:#E8EEFF}
.presets .btn.small:nth-child(5n+4){background:#FFF4CC}
.presets .btn.small.active{background:var(--ink);color:var(--paper)}
.keys{font-size:15px;opacity:.8;text-align:center}
.keys kbd{font-family:var(--f-body);border:2px solid var(--ink);padding:0 6px;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}

/* fireworks & done banner */
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.done-wrap{position:fixed;inset:0;display:grid;place-items:center;z-index:30;padding:16px;pointer-events:none}
.done-card{
  pointer-events:auto;background:var(--yellow);border:var(--bw) solid var(--ink);box-shadow:12px 12px 0 var(--ink);
  padding:26px 30px;text-align:center;animation:pop .6s cubic-bezier(.3,1.7,.5,1) both;max-width:100%;
}
.done-card h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,10vw,84px);line-height:1;transform:rotate(-3deg)}
.done-card p{margin:0 0 18px;font-size:20px}
.done-card .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

@keyframes pop{0%{transform:scale(.4) rotate(-10deg);opacity:0}100%{opacity:1}}
@keyframes blink{50%{opacity:.15}}
@keyframes throb{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translate(-8px,2px) rotate(-1deg)}75%{transform:translate(8px,-2px) rotate(1deg)}}
@keyframes stripes{to{background-position:40px 0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
@media (max-width:520px){
  .clock,.unit-row{--d:clamp(44px,16vw,90px)}
  .btn.go{min-width:0;flex:1 1 100%}
  .panel{box-shadow:6px 6px 0 var(--ink)}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const SEG = {0:"abcdef",1:"bc",2:"abged",3:"abgcd",4:"fgbc",5:"afgcd",6:"afgedc",7:"abc",8:"abcdefg",9:"abcdfg"};
const PRESETS = [1, 3, 5, 10, 15, 20];
const FX_COLORS = ["#FFD23F","#FF6B9E","#38D9A9","#6C8CFF","#FF8A3D","#FFFFFF"];
const pad = n => String(n).padStart(2, "0");
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function Digit({ n }) {
  const on = SEG[n];
  return (
    <div className="digit" aria-hidden="true">
      {"abcdefg".split("").map(s => <i key={s} className={"seg s-" + s + (on.includes(s) ? " on" : "")} />)}
    </div>
  );
}

/* ---------- 폭죽 ---------- */
function Fireworks({ active }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!active) return;
    const c = ref.current, ctx = c.getContext("2d");
    let w = 0, h = 0, raf;
    const resize = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      w = window.innerWidth; h = window.innerHeight;
      c.width = w * dpr; c.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener("resize", resize);
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const LAUNCH_FOR = reduce ? 2500 : 8000, EVERY = reduce ? 900 : 320;
    const rockets = [], parts = [];
    const t0 = performance.now();
    let lastLaunch = 0;

    const launch = () => {
      const target = h * (0.35 + Math.random() * 0.4);
      rockets.push({
        x: w * (0.1 + Math.random() * 0.8), y: h + 10,
        vx: (Math.random() - 0.5) * 2.2,
        vy: -Math.sqrt(2 * 0.16 * target),
        color: FX_COLORS[(Math.random() * FX_COLORS.length) | 0],
      });
    };
    const burst = r => {
      const n = 60 + ((Math.random() * 40) | 0);
      const ring = Math.random() < 0.35;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + Math.random() * 0.1;
        const sp = ring ? 4.2 : 1 + Math.random() * 4.5;
        parts.push({
          x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1, decay: 0.009 + Math.random() * 0.012,
          size: 4 + Math.random() * 4,
          color: Math.random() < 0.75 ? r.color : FX_COLORS[(Math.random() * FX_COLORS.length) | 0],
        });
      }
    };

    const frame = now => {
      const elapsed = now - t0;
      if (elapsed < LAUNCH_FOR && now - lastLaunch > EVERY) {
        launch(); if (!reduce && Math.random() < 0.4) launch();
        lastLaunch = now;
      }
      ctx.clearRect(0, 0, w, h);
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.x += r.vx; r.y += r.vy; r.vy += 0.16;
        ctx.fillStyle = "#141414"; ctx.fillRect(r.x - 4, r.y - 4, 8, 14);
        ctx.fillStyle = r.color; ctx.fillRect(r.x - 2.5, r.y - 2.5, 5, 11);
        if (r.vy >= -0.6) { burst(r); rockets.splice(i, 1); }
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.vx *= 0.975; p.vy = p.vy * 0.975 + 0.07;
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        const s = p.size * (0.5 + p.life * 0.5);
        ctx.globalAlpha = Math.min(1, p.life * 1.4);
        ctx.fillStyle = "#141414"; ctx.fillRect(p.x - s / 2 - 1.5, p.y - s / 2 - 1.5, s + 3, s + 3);
        ctx.fillStyle = p.color; ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
        ctx.globalAlpha = 1;
      }
      if (elapsed < LAUNCH_FOR || rockets.length || parts.length) raf = requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    };
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); ctx.clearRect(0, 0, w, h); };
  }, [active]);
  return <canvas ref={ref} className="fx" aria-hidden="true" />;
}

/* ---------- 소리 ---------- */
function useChime() {
  const ac = useRef(null);
  const unlock = useCallback(() => {
    try {
      if (!ac.current) ac.current = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.current.state === "suspended") ac.current.resume();
    } catch (e) {}
  }, []);
  const play = useCallback(() => {
    const a = ac.current; if (!a) return;
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    notes.forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      const t = a.currentTime + i * 0.16;
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.4);
    });
  }, []);
  return { unlock, play };
}

/* ---------- 앱 ---------- */
function App() {
  const [mins, setMins] = useState(5);
  const [secs, setSecs] = useState(0);
  const [remain, setRemain] = useState(5 * 60 * 1000);
  const [status, setStatus] = useState("idle"); // idle | running | paused | done
  const [sound, setSound] = useState(true);
  const [now, setNow] = useState(new Date());
  const endRef = useRef(0);
  const wakeRef = useRef(null);
  const { unlock, play } = useChime();

  const totalMs = (mins * 60 + secs) * 1000;

  useEffect(() => { const id = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(id); }, []);

  // 설정이 바뀌면 남은 시간도 맞춤 (대기 상태일 때만)
  useEffect(() => { if (status === "idle") setRemain(totalMs); }, [totalMs, status]);

  // 카운트다운
  useEffect(() => {
    if (status !== "running") return;
    const tick = () => {
      const r = Math.max(0, endRef.current - Date.now());
      setRemain(r);
      if (r <= 0) setStatus("done");
    };
    tick();
    const id = setInterval(tick, 100);
    return () => clearInterval(id);
  }, [status]);

  // 끝났을 때 소리
  useEffect(() => { if (status === "done" && sound) play(); }, [status]);

  // 화면 꺼짐 방지
  useEffect(() => {
    if (status === "running" && navigator.wakeLock) {
      navigator.wakeLock.request("screen").then(l => { wakeRef.current = l; }).catch(() => {});
    } else if (wakeRef.current) {
      wakeRef.current.release().catch(() => {}); wakeRef.current = null;
    }
  }, [status]);

  const start = () => {
    if (totalMs <= 0) return;
    unlock();
    const base = status === "paused" ? remain : totalMs;
    endRef.current = Date.now() + base;
    setRemain(base);
    setStatus("running");
  };
  const pause = () => setStatus("paused");
  const reset = () => { setStatus("idle"); setRemain(totalMs); };
  const toggle = () => (status === "running" ? pause() : start());

  // 키보드: 스페이스 = 시작/일시정지, R = 처음으로
  useEffect(() => {
    const onKey = e => {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") { e.preventDefault(); toggle(); }
      else if (e.key === "r" || e.key === "R" || e.key === "ㄱ") reset();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const editable = status === "idle" || status === "done";
  const setM = v => { if (status === "done") setStatus("idle"); setMins(clamp(v, 0, 99)); };
  const setS = v => {
    if (status === "done") setStatus("idle");
    if (v > 59) { if (mins < 99) { setMins(mins + 1); setSecs(0); } return; }
    if (v < 0) { if (mins > 0) { setMins(mins - 1); setSecs(59); } else setSecs(0); return; }
    setSecs(v);
  };
  const preset = m => { setStatus("idle"); setMins(m); setSecs(0); };

  const fullscreen = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };

  const left = Math.ceil(remain / 1000);
  const dm = Math.floor(left / 60), ds = left % 60;
  const digits = (pad(Math.min(dm, 99)) + pad(ds)).split("").map(Number);
  const hurry = status === "running" && left <= 10 && left > 0;
  const pct = totalMs > 0 ? (remain / totalMs) * 100 : 0;
  const statusText = { idle: "준비", running: "진행 중", paused: "일시정지", done: "끝!" }[status];
  const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const dateStr = `${now.getMonth() + 1}월 ${now.getDate()}일 (${"일월화수목금토"[now.getDay()]})`;

  return (
    <div className="wrap">
      <header className="top">
        <h1 className="title">금샘의 <span>행복한</span> 수업</h1>
        <div className="top-right">
          <div className="chip">{dateStr} · 지금 {timeStr}</div>
          <button className="btn small" onClick={() => setSound(s => !s)} aria-pressed={sound}>
            {sound ? "소리 켬" : "소리 끔"}
          </button>
          <button className="btn small" onClick={fullscreen}>전체 화면</button>
        </div>
      </header>

      <section
        className={"panel" + (hurry ? " hurry" : "") + (status === "done" ? " done" : "")}
        aria-label={`남은 시간 ${dm}분 ${ds}초`}
      >
        <div className="panel-label">CLASS TIMER</div>
        <div className={"status " + status}>{statusText}</div>
        <div className={"clock" + (status === "running" ? " blink" : "")}>
          <div className="pair"><Digit n={digits[0]} /><Digit n={digits[1]} /></div>
          <div className="colon"><i /><i /></div>
          <div className="pair"><Digit n={digits[2]} /><Digit n={digits[3]} /></div>
        </div>
        <div className="unit-row"><span>MIN</span><span>SEC</span></div>
      </section>

      <div className="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={Math.round(pct)}>
        <div className={"fill" + (status === "running" ? " moving" : "") + (hurry ? " hurry" : "")} style={{ width: pct + "%" }} />
      </div>

      <div className="controls">
        {status === "running" ? (
          <button className="btn go pause" onClick={pause}>일시정지</button>
        ) : (
          <button className="btn go" onClick={start} disabled={totalMs <= 0}>
            {status === "paused" ? "계속하기" : status === "done" ? "다시 시작" : "시작"}
          </button>
        )}
        <button className="btn big reset" onClick={reset}>처음으로</button>
      </div>

      <section className={"board" + (editable ? "" : " locked")}>
        <div className="board-head">
          <h2>시간 설정</h2>
          <span className="hint">{editable ? "분과 초를 정하거나 아래 버튼을 눌러요" : "타이머를 멈추고 처음으로를 누르면 바꿀 수 있어요"}</span>
        </div>
        <div className="steppers">
          <div className="stepper">
            <label htmlFor="min">분</label>
            <button className="btn sq" onClick={() => setM(mins - 1)} disabled={!editable} aria-label="1분 줄이기">−</button>
            <input id="min" className="num" type="number" inputMode="numeric" min="0" max="99" value={pad(mins)}
              disabled={!editable} onChange={e => setM(parseInt(e.target.value || "0", 10))} />
            <button className="btn sq" onClick={() => setM(mins + 1)} disabled={!editable} aria-label="1분 늘리기">+</button>
          </div>
          <div className="stepper">
            <label htmlFor="sec">초</label>
            <button className="btn sq" onClick={() => setS(secs - 10)} disabled={!editable} aria-label="10초 줄이기">−</button>
            <input id="sec" className="num" type="number" inputMode="numeric" min="0" max="59" value={pad(secs)}
              disabled={!editable} onChange={e => setSecs(clamp(parseInt(e.target.value || "0", 10), 0, 59))} />
            <button className="btn sq" onClick={() => setS(secs + 10)} disabled={!editable} aria-label="10초 늘리기">+</button>
          </div>
        </div>
        <div className="presets">
          {PRESETS.map(m => (
            <button key={m} className={"btn small" + (mins === m && secs === 0 ? " active" : "")}
              onClick={() => preset(m)} disabled={!editable}>{m}분</button>
          ))}
          <button className="btn small" onClick={() => { setStatus("idle"); setMins(0); setSecs(30); }} disabled={!editable}>30초</button>
        </div>
      </section>

      <p className="keys"><kbd>Space</kbd> 시작 / 일시정지 &nbsp; <kbd>R</kbd> 처음으로</p>

      <Fireworks active={status === "done"} />
      {status === "done" && (
        <div className="done-wrap">
          <div className="done-card" role="alert">
            <h3>시간 끝!</h3>
            <p>모두 수고했어요. 정리하고 다음 활동으로 가요.</p>
            <div className="row">
              <button className="btn" onClick={start}>한 번 더</button>
              <button className="btn" onClick={reset}>닫기</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
